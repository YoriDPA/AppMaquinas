<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Diário de Máquina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para o spinner de carregamento */
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Registro Diário de Operação da Máquina</h1>
            <p class="text-gray-600 mt-2">Anote aqui as informações diárias de cada máquina.</p>
        </header>

        <!-- Seção de Autenticação e Carregamento -->
        <div id="auth-status" class="text-center p-4 mb-6 bg-white rounded-lg shadow-md">
            <p id="auth-message">Conectando ao banco de dados...</p>
            <div id="loader" class="loader mx-auto my-2 hidden"></div>
            <p class="text-xs text-gray-500 mt-2">ID de Usuário: <span id="user-id" class="font-mono">N/A</span></p>
        </div>

        <!-- Formulário de Registro -->
        <div id="app-content" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 class="text-2xl font-semibold mb-4">Novo Registro</h2>
                <form id="log-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="data" class="block text-sm font-medium text-gray-700">Data</label>
                            <input type="date" id="data" name="data" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="motorista" class="block text-sm font-medium text-gray-700">Nome do Motorista</label>
                            <input type="text" id="motorista" name="motorista" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ex: João da Silva">
                        </div>
                    </div>
                    
                    <div class="flex items-center">
                        <input id="rodou" name="rodou" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="rodou" class="ml-2 block text-sm font-medium text-gray-900">A máquina rodou hoje?</label>
                    </div>

                    <div id="detalhes-operacao" class="space-y-4 hidden">
                         <div>
                            <label for="rota" class="block text-sm font-medium text-gray-700">Rota Realizada</label>
                            <input type="text" id="rota" name="rota" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ex: Centro -> Bairro Sul">
                        </div>
                        <div>
                            <label for="rua" class="block text-sm font-medium text-gray-700">Rua(s) Limpa(s)</label>
                            <textarea id="rua" name="rua" rows="3" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ex: Av. Principal, Rua das Flores"></textarea>
                        </div>
                        <div>
                            <label for="km" class="block text-sm font-medium text-gray-700">Quilometragem (km)</label>
                            <input type="number" id="km" name="km" min="0" step="0.1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ex: 50.5">
                        </div>
                    </div>

                    <div class="text-right">
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Salvar Registro
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabela de Histórico -->
            <div>
                <h2 class="text-2xl font-semibold mb-4">Histórico de Registros</h2>
                <div class="bg-white shadow-md rounded-lg overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rodou?</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Motorista</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rota</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rua(s)</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">KM</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="bg-white divide-y divide-gray-200">
                             <tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">Carregando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação/Alerta -->
    <div id="modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title"></h3>
                <div class="mt-2 px-7 py-3">
                    <p class="text-sm text-gray-500" id="modal-message"></p>
                </div>
                <div class="items-center px-4 py-3 space-x-2" id="modal-buttons">
                    <!-- Botões serão injetados aqui -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Importações do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuração do Firebase ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", projectId: "YOUR_PROJECT_ID" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('debug');

        // --- Elementos do DOM ---
        const logForm = document.getElementById('log-form');
        const logsTableBody = document.getElementById('logs-table-body');
        const rodouCheckbox = document.getElementById('rodou');
        const detalhesOperacaoDiv = document.getElementById('detalhes-operacao');
        const dataInput = document.getElementById('data');
        const authMessage = document.getElementById('auth-message');
        const userIdSpan = document.getElementById('user-id');
        const loader = document.getElementById('loader');
        const appContent = document.getElementById('app-content');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalButtons = document.getElementById('modal-buttons');

        let userId = null;
        let logsCollectionRef = null;
        let unsubscribe = null;

        // --- Funções do Modal ---
        function showModal(title, message, buttons = [{ text: "OK", action: hideModal, class: "bg-indigo-600 hover:bg-indigo-700 text-white" }]) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalButtons.innerHTML = '';
            buttons.forEach(btnInfo => {
                const button = document.createElement('button');
                button.textContent = btnInfo.text;
                button.className = `px-4 py-2 rounded-md text-sm font-medium focus:outline-none ${btnInfo.class || 'bg-gray-300 hover:bg-gray-400'}`;
                button.onclick = btnInfo.action;
                modalButtons.appendChild(button);
            });
            modal.classList.remove('hidden');
        }

        function hideModal() {
            modal.classList.add('hidden');
        }

        // --- Funções Principais ---
        function setTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            dataInput.value = `${year}-${month}-${day}`;
        }

        function toggleDetalhes() {
            if (rodouCheckbox.checked) {
                detalhesOperacaoDiv.classList.remove('hidden');
            } else {
                detalhesOperacaoDiv.classList.add('hidden');
            }
        }

        function renderLogs(logs) {
            logsTableBody.innerHTML = '';
            if (logs.length === 0) {
                logsTableBody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">Nenhum registro encontrado.</td></tr>';
                return;
            }
            logs.sort((a, b) => new Date(b.data) - new Date(a.data));
            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${new Date(log.data + 'T00:00:00-03:00').toLocaleDateString('pt-BR')}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${log.rodou ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Sim</span>' : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Não</span>'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.motorista}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.rota || 'N/A'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 break-words max-w-xs">${log.rua || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.km || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button data-id="${log.id}" class="text-red-600 hover:text-red-900 delete-btn">Excluir</button>
                    </td>
                `;
                logsTableBody.appendChild(tr);
            });
        }

        function getLogs() {
            if (unsubscribe) unsubscribe();
            const q = query(logsCollectionRef);
            unsubscribe = onSnapshot(q, (querySnapshot) => {
                const logs = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLogs(logs);
            }, (error) => {
                console.error("Erro ao buscar registros: ", error);
                logsTableBody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-red-500">Erro ao carregar dados.</td></tr>';
            });
        }

        async function saveLog(event) {
            event.preventDefault();
            const formData = new FormData(logForm);
            const logData = {
                data: formData.get('data'),
                motorista: formData.get('motorista'),
                rodou: formData.get('rodou') === 'on',
                rota: formData.get('rota') || '',
                rua: formData.get('rua') || '',
                km: formData.get('km') || '',
                createdAt: new Date()
            };

            try {
                await addDoc(logsCollectionRef, logData);
                logForm.reset();
                setTodayDate();
                toggleDetalhes();
            } catch (error) {
                console.error("Erro ao salvar o registro: ", error);
                showModal("Erro", "Ocorreu um erro ao salvar. Tente novamente.");
            }
        }
        
        async function executeDelete(id) {
             try {
                const docRef = doc(db, `/artifacts/${appId}/users/${userId}/machine_logs`, id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Erro ao excluir o registro: ", error);
                showModal("Erro", "Ocorreu um erro ao excluir. Tente novamente.");
            }
        }

        function deleteLog(id) {
            showModal(
                "Confirmar Exclusão",
                "Tem certeza que deseja excluir este registro?",
                [
                    { text: "Cancelar", class: "bg-gray-200 hover:bg-gray-300", action: hideModal },
                    { text: "Excluir", class: "bg-red-600 hover:bg-red-700 text-white", action: () => {
                        executeDelete(id);
                        hideModal();
                    }}
                ]
            );
        }

        // --- Inicialização e Event Listeners ---
        rodouCheckbox.addEventListener('change', toggleDetalhes);
        logForm.addEventListener('submit', saveLog);
        logsTableBody.addEventListener('click', (event) => {
            if (event.target.classList.contains('delete-btn')) {
                const id = event.target.getAttribute('data-id');
                deleteLog(id);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                userIdSpan.textContent = userId;
                authMessage.textContent = 'Conectado com sucesso!';
                loader.classList.add('hidden');
                logsCollectionRef = collection(db, `/artifacts/${appId}/users/${userId}/machine_logs`);
                appContent.classList.remove('hidden');
                getLogs();
            } else {
                authMessage.textContent = 'Usuário não autenticado. Tentando login anônimo...';
                userIdSpan.textContent = 'N/A';
                loader.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        });

        async function initializeAuth() {
            try {
                loader.classList.remove('hidden');
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Erro na autenticação: ", error);
                authMessage.textContent = 'Falha na autenticação. Verifique sua conexão e atualize a página.';
                loader.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTodayDate();
            toggleDetalhes();
            initializeAuth();
        });
    </script>
</body>
</html>
