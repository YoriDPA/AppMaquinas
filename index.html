<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Diário de Máquina com Roteiros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Registro Diário por Roteiro</h1>
            <p class="text-gray-600 mt-2">Selecione o roteiro e marque as ruas concluídas.</p>
        </header>

        <div id="auth-status" class="text-center p-4 mb-6 bg-white rounded-lg shadow-md">
            <p id="auth-message">Conectando ao banco de dados...</p>
            <div id="loader" class="loader mx-auto my-2 hidden"></div>
            <p class="text-xs text-gray-500 mt-2">ID de Usuário: <span id="user-id" class="font-mono">N/A</span></p>
        </div>

        <div id="app-content" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 class="text-2xl font-semibold mb-4">Novo Registro</h2>
                <form id="log-form" class="space-y-6">
                    <!-- Informações Gerais -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="data" class="block text-sm font-medium text-gray-700">Data</label>
                            <input type="date" id="data" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="motorista" class="block text-sm font-medium text-gray-700">Nome do Motorista</label>
                            <input type="text" id="motorista" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ex: João da Silva">
                        </div>
                    </div>

                    <!-- Seleção de Roteiro -->
                    <div>
                        <label for="roteiro-select" class="block text-sm font-medium text-gray-700">Selecione o Roteiro</label>
                        <select id="roteiro-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                            <option value="">-- Escolha um dia --</option>
                            <!-- Opções de roteiro serão inseridas aqui -->
                        </select>
                    </div>

                    <!-- Checklist de Ruas -->
                    <div id="ruas-checklist-container" class="hidden">
                        <h3 class="text-lg font-medium text-gray-900 mb-2">Ruas / Avenidas</h3>
                        <div id="ruas-checklist" class="space-y-2 max-h-60 overflow-y-auto p-3 border rounded-md bg-gray-50">
                            <!-- Checklist será inserido aqui -->
                        </div>
                         <div class="mt-4 text-right">
                            <span class="text-lg font-bold text-gray-800">Total KM: <span id="total-km" class="text-indigo-600">0.00</span></span>
                        </div>
                    </div>

                    <div class="text-right">
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Salvar Registro
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabela de Histórico -->
            <div>
                <h2 class="text-2xl font-semibold mb-4">Histórico de Registros</h2>
                <div class="bg-white shadow-md rounded-lg overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Motorista</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Roteiro</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ruas Concluídas</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">KM Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Carregando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuração do Firebase ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", projectId: "YOUR_PROJECT_ID" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('debug');

        // --- Dados dos Roteiros (Baseado na sua imagem) ---
        const roteiros = {
            "sexta-feira": {
                nome: "Roteiro de Sexta-feira",
                ruas: [
                    { nome: "Av. Paulino Muller", km: 3.07 },
                    { nome: "Av. Elias Miguel", km: 0.82 },
                    { nome: "Av. Getúlio Vargas", km: 2.57 },
                    { nome: "Av. Governador Bley", km: 2.27 },
                    { nome: "Av. Princesa Isabel", km: 2.30 },
                    { nome: "Av. Jerônimo Monteiro", km: 2.34 },
                    { nome: "Av. Florentino Avidos", km: 0.91 },
                    { nome: "Av. Mal. Mascarenhas de Moraes", km: 14.70 }
                ]
            },
            "quinta-feira": {
                nome: "Roteiro de Quinta-feira",
                ruas: [
                    { nome: "Rua A", km: 1.5 },
                    { nome: "Rua B", km: 2.1 },
                    { nome: "Avenida C", km: 3.0 }
                ]
            },
            // Adicione outros dias aqui
        };

        // --- Elementos do DOM ---
        const logForm = document.getElementById('log-form');
        const logsTableBody = document.getElementById('logs-table-body');
        const dataInput = document.getElementById('data');
        const roteiroSelect = document.getElementById('roteiro-select');
        const ruasChecklistContainer = document.getElementById('ruas-checklist-container');
        const ruasChecklist = document.getElementById('ruas-checklist');
        const totalKmSpan = document.getElementById('total-km');
        const authMessage = document.getElementById('auth-message');
        const userIdSpan = document.getElementById('user-id');
        const loader = document.getElementById('loader');
        const appContent = document.getElementById('app-content');

        let userId = null;
        let logsCollectionRef = null;
        let unsubscribe = null;

        // --- Funções ---

        function setTodayDate() {
            const today = new Date();
            dataInput.value = today.toISOString().split('T')[0];
        }

        function popularRoteiros() {
            for (const key in roteiros) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = roteiros[key].nome;
                roteiroSelect.appendChild(option);
            }
        }

        function calcularTotalKm() {
            let total = 0;
            const checkboxes = ruasChecklist.querySelectorAll('input[type="checkbox"]:checked');
            checkboxes.forEach(cb => {
                total += parseFloat(cb.dataset.km);
            });
            totalKmSpan.textContent = total.toFixed(2).replace('.', ',');
        }

        function exibirChecklistRoteiro() {
            const roteiroKey = roteiroSelect.value;
            ruasChecklist.innerHTML = '';
            totalKmSpan.textContent = '0,00';

            if (!roteiroKey) {
                ruasChecklistContainer.classList.add('hidden');
                return;
            }

            const roteiro = roteiros[roteiroKey];
            roteiro.ruas.forEach((rua, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.innerHTML = `
                    <input id="rua-${index}" type="checkbox" data-km="${rua.km}" data-nome="${rua.nome}" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="rua-${index}" class="ml-3 block text-sm text-gray-700 w-full flex justify-between">
                        <span>${rua.nome}</span>
                        <span class="font-medium text-gray-500">${String(rua.km.toFixed(2)).replace('.', ',')} km</span>
                    </label>
                `;
                ruasChecklist.appendChild(div);
            });

            ruasChecklistContainer.classList.remove('hidden');
            ruasChecklist.addEventListener('change', calcularTotalKm);
        }

        function renderLogs(logs) {
            logsTableBody.innerHTML = '';
            if (logs.length === 0) {
                logsTableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Nenhum registro encontrado.</td></tr>';
                return;
            }

            logs.sort((a, b) => new Date(b.data) - new Date(a.data));

            logs.forEach(log => {
                const tr = document.createElement('tr');
                const ruasConcluidasHtml = log.ruasConcluidas && log.ruasConcluidas.length > 0
                    ? log.ruasConcluidas.join('<br>')
                    : 'Nenhuma';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${new Date(log.data + 'T00:00:00-03:00').toLocaleDateString('pt-BR')}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.motorista}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.roteiroNome}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${ruasConcluidasHtml}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${String(log.kmTotal.toFixed(2)).replace('.', ',')}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button data-id="${log.id}" class="text-red-600 hover:text-red-900 delete-btn">Excluir</button>
                    </td>
                `;
                logsTableBody.appendChild(tr);
            });
        }

        function getLogs() {
            if (unsubscribe) unsubscribe();
            const q = query(logsCollectionRef);
            unsubscribe = onSnapshot(q, (snapshot) => {
                const logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLogs(logs);
            }, (error) => {
                console.error("Erro ao buscar registros: ", error);
            });
        }

        async function saveLog(event) {
            event.preventDefault();
            const roteiroKey = roteiroSelect.value;
            if (!roteiroKey) {
                alert("Por favor, selecione um roteiro.");
                return;
            }

            const ruasConcluidas = [];
            const checkboxes = ruasChecklist.querySelectorAll('input[type="checkbox"]:checked');
            checkboxes.forEach(cb => {
                ruasConcluidas.push(cb.dataset.nome);
            });

            const logData = {
                data: document.getElementById('data').value,
                motorista: document.getElementById('motorista').value,
                roteiroNome: roteiros[roteiroKey].nome,
                ruasConcluidas: ruasConcluidas,
                kmTotal: parseFloat(totalKmSpan.textContent.replace(',', '.')),
                createdAt: new Date()
            };

            try {
                await addDoc(logsCollectionRef, logData);
                logForm.reset();
                setTodayDate();
                exibirChecklistRoteiro();
            } catch (error) {
                console.error("Erro ao salvar o registro: ", error);
                alert("Ocorreu um erro ao salvar.");
            }
        }

        async function deleteLog(id) {
            if (!confirm("Tem certeza que deseja excluir este registro?")) return;
            try {
                const docRef = doc(db, `/artifacts/${appId}/users/${userId}/machine_logs_roteiros`, id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Erro ao excluir o registro: ", error);
                alert("Ocorreu um erro ao excluir.");
            }
        }

        // --- Inicialização e Event Listeners ---
        
        roteiroSelect.addEventListener('change', exibirChecklistRoteiro);
        logForm.addEventListener('submit', saveLog);
        logsTableBody.addEventListener('click', (event) => {
            if (event.target.classList.contains('delete-btn')) {
                deleteLog(event.target.dataset.id);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                userIdSpan.textContent = userId;
                authMessage.textContent = 'Conectado com sucesso!';
                loader.classList.add('hidden');
                logsCollectionRef = collection(db, `/artifacts/${appId}/users/${userId}/machine_logs_roteiros`);
                appContent.classList.remove('hidden');
                getLogs();
            } else {
                authMessage.textContent = 'Usuário não autenticado.';
                loader.classList.add('hidden');
                appContent.classList.add('hidden');
            }
        });

        async function initializeAuth() {
            try {
                loader.classList.remove('hidden');
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Erro na autenticação: ", error);
                authMessage.textContent = 'Falha na autenticação.';
                loader.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTodayDate();
            popularRoteiros();
            initializeAuth();
        });
    </script>
</body>
</html>
